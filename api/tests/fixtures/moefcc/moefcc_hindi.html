    <h1>विश्व आर्द्रभूमि दिवस: भारत में 80 रामसर स्थल घोषित</h1>
    <div class="meta">दिनांक: 02 फरवरी 2024</div>
    <p>भारत ने विश्व आर्द्रभूमि दिवस पर 5 नई आर्द्रभूमियों को 80 रामसर स्थलों के रूप में नामित किया है, जिससे देश में कुल रामसर स्थलों की संख्या बढ़कर 80 हो गई है।</p>
