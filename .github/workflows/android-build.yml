name: Android CI & Production Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish Production Release & Update In-App Notification System'
        required: true
        type: boolean
        default: true
      version_name:
        description: 'Custom Version Name (e.g. 1.1.0). Leave blank for auto.'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Custom Version Code (e.g. 2). Leave blank for auto.'
        required: false
        type: string
        default: ''

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Validate Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: https://ikshovia.onrender.com
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Release Mode & Versioning
        id: release_config
        run: |
          # 1. Determine if this run should publish a production release
          IS_RELEASE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish_release }}" = "true" ]; then
            IS_RELEASE=true
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_RELEASE=true
          fi
          echo "IS_RELEASE=${IS_RELEASE}" >> $GITHUB_ENV
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

          # 2. Determine Version Code and Name
          BASE_VERSION_CODE=1
          CALC_VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          CALC_VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"

          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            VERSION_CODE="${{ github.event.inputs.version_code }}"
          else
            VERSION_CODE="${CALC_VERSION_CODE}"
          fi

          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="${CALC_VERSION_NAME}"
          fi

          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "=== Pipeline Configuration ==="
          echo "Release Mode: ${IS_RELEASE}"
          echo "Version Code: ${VERSION_CODE}"
          echo "Version Name: ${VERSION_NAME}"

      - name: Configure Android Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔐 Found repository signing keystore secret. Decoding..."
            mkdir -p android/keystores
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystores/release.keystore
            echo "SIGNING_ARGS=-PMYAPP_RELEASE_STORE_FILE=../keystores/release.keystore -PMYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD -PMYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS -PMYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "✅ Configured custom release keystore for build."
          else
            echo "ℹ️ No ANDROID_KEYSTORE_BASE64 secret provided. Using standard build signing."
            echo "SIGNING_ARGS=" >> $GITHUB_ENV
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./android/gradlew

      - name: Compile Android APK via Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            ${{ env.SIGNING_ARGS }} \
            --stacktrace

      - name: Prepare Built Artifacts
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/ikshovia-v${{ env.VERSION_NAME }}.apk

      - name: Upload Build Artifact (All Runs)
        uses: actions/upload-artifact@v4
        with:
          name: ikshovia-android-v${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}
          path: build-artifacts/
          retention-days: 30

      - name: Verify APK & Publish Release Metadata (Intentional Release Only)
        if: env.IS_RELEASE == 'true'
        id: metadata
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          MIN_SUPPORTED_VERSION_CODE: 1
          IS_MANDATORY: false
          PROD_API_URL: https://ikshovia.onrender.com
          CI_RELEASE_SECRET: ${{ secrets.CI_RELEASE_SECRET || secrets.ADMIN_API_KEY || secrets.AUTH_SECRET || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}
          APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          node scripts/publish_release_metadata.cjs
          cp public/apk/release-metadata.json build-artifacts/release-metadata.json

      - name: Publish to GitHub Releases (Intentional Release Only)
        uses: softprops/action-gh-release@v2
        if: env.IS_RELEASE == 'true'
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: IKSHOVIA Android v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          draft: false
          prerelease: false
          files: |
            build-artifacts/app-debug.apk
            build-artifacts/ikshovia-v${{ env.VERSION_NAME }}.apk
            build-artifacts/release-metadata.json
          body: |
            ### IKSHOVIA Android Production Release v${{ env.VERSION_NAME }}
            - **Package ID:** `com.ikshovia.app`
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Backend URL:** `https://ikshovia.onrender.com`
            - **Distribution:** Direct APK download with automatic in-app update notifications.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
